    <script>
      // Global error safeguard to intercept unhandled exceptions and prevent bubbling to parent frame as cross-origin "Script error."
      (function () {
        window.onerror = function (msg, url, lineno, colno, error) {
          console.warn('Safely intercepted error:', { msg, url, lineno, colno, error: error?.stack || error });
          return true; // Suppress default browser and cross-origin error reporting
        };

        window.addEventListener(
          'error',
          function (e) {
            console.warn('Safely captured error event:', e && (e.message || e.type), e);
            if (e) {
              if (typeof e.preventDefault === 'function') e.preventDefault();
              if (typeof e.stopPropagation === 'function') e.stopPropagation();
              if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            }
            return true;
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            console.warn('Safely captured unhandled promise rejection:', e && e.reason);
            if (e) {
              if (typeof e.preventDefault === 'function') e.preventDefault();
              if (typeof e.stopPropagation === 'function') e.stopPropagation();
              if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            }
            return true;
          },
          true
        );
      })();
    </script>
