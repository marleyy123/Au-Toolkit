[build]
  command = "node node_modules/vite/bin/vite.js build && node scripts/build-netlify-functions.mjs"
  publish = "dist"
  functions = "netlify/functions-dist"

[build.environment]
  NODE_VERSION = "20.19.6"
  VITE_FIREBASE_AUTH_DOMAIN = "autoolkit.com"
  APP_URL = "https://autoolkit.com"
  ALLOWED_ORIGINS = "https://autoolkit.com,https://www.autoolkit.com"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID,FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,ALLOWED_ORIGINS,APP_URL,VITE_FIREBASE_DATABASE_ID"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/__/auth/*"
  to = "https://au-toolkit-production.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://au-toolkit-production.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-buyer"
  to = "/.netlify/functions/verify-buyer"
  status = 200
  force = true

[[redirects]]
  from = "/api/export-render"
  to = "/.netlify/functions/export-render"
  status = 200
  force = true

[[redirects]]
  from = "/api/regional-pricing"
  to = "/.netlify/functions/regional-pricing"
  status = 200
  force = true

[[redirects]]
  from = "/api/midtrans"
  to = "/.netlify/functions/midtrans"
  status = 200
  force = true

[[redirects]]
  from = "/api/midtrans-webhook"
  to = "/.netlify/functions/midtrans-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/cloud-media"
  to = "https://au-toolkit-media.denowstudio.workers.dev/media"
  status = 200
  force = true
  [redirects.headers]
    Origin = "https://autoolkit.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200