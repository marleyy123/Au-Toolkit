[build]
  command = "node node_modules/vite/bin/vite.js build && node scripts/build-netlify-functions.mjs"
  publish = "dist"
  functions = "netlify/functions-dist"

[build.environment]
  NODE_VERSION = "20.19.6"
  VITE_FIREBASE_AUTH_DOMAIN = "auth.autoolkit.com"
  APP_URL = "https://autoolkit.com"
  ALLOWED_ORIGINS = "https://autoolkit.com"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID,FIREBASE_PROJECT_ID,ALLOWED_ORIGINS,APP_URL"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/api/verify-buyer"
  to = "/.netlify/functions/verify-buyer"
  status = 200
  force = true

[[redirects]]
  from = "/api/export-render"
  to = "/.netlify/functions/export-render"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
